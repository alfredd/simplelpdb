[package]
name = "zxnia"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.7"
tokio = { version = "1.18", features = ["full"] }
prost = "0.10.1"
warp = "0.3"
serde = {version = "1.0.215", features = ["derive"]}
serde_json = "1.0.133"
log = "0.4"


[build-dependencies]
tonic-build = "0.7"

[[bin]] # Bin to run the HelloWorld gRPC client
name = "ec"
path = "src/cxc/edge_client.rs"

[[bin]] # Bin to run the HelloWorld gRPC server
name = "edge"
path = "src/edge.rs"

#[[bin]] # Bin to run the HelloWorld gRPC client
#name = "client"
#path = "src/client.rs"

[[bin]] # Bin to run the HelloWorld gRPC client
name = "rte"
path = "src/rte.rs"

[[bin]] # Bin to run the HelloWorld gRPC client
name = "web"
path = "src/web.rs"
